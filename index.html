<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1520"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Roam Tank Lab"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" href="./icon-192.png"><title>Roam Tank Lab V1 · Belerick & Tigreal</title><style>
:root{color-scheme:dark;--bg:#08111b;--panel:#132232;--edge:#294458;--txt:#f0f8ff;--muted:#a6bac9;--teal:#6be2cb;--yellow:#e9cb84;--soft:#182f40}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#16384b 0%,transparent 42%),var(--bg);font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}button,input{font:inherit}button{cursor:pointer}main{max-width:500px;margin:auto;padding:16px 12px 36px}.brand{display:flex;align-items:center;gap:11px;margin:5px 0 14px}.brand img{width:48px;height:48px;border-radius:12px}.brand strong{font-size:21px;letter-spacing:-.5px;display:block}.sub,.fine{color:var(--muted);font-size:11px}.patch{margin-left:auto;background:#23403b;color:#b2f7d8;border-radius:7px;padding:6px 8px;font-weight:800;font-size:10px}.panel{border:1px solid var(--edge);background:var(--panel);border-radius:14px;padding:12px;margin:0 0 10px;box-shadow:0 8px 25px #0002}.panel h2{font-size:13px;margin:0 0 9px;letter-spacing:.15px}.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.heroPick{display:flex;align-items:center;gap:8px;background:#0d1b2a;border:1px solid #365268;padding:10px 8px;border-radius:11px;color:var(--txt);text-align:left}.heroPick.active{border:2px solid var(--teal);padding:9px 7px;background:#173c41}.heroPick .avatar{height:46px;width:46px}.heroPick b{display:block;font-size:14px}.heroPick small{display:block;font-size:10px;color:var(--muted)}.avatar{display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#284b58;border-radius:9px;flex-shrink:0;font-weight:900;color:#c9efec}.avatar img{height:100%;width:100%;object-fit:cover;position:absolute;inset:0}.boxhead{display:flex;justify-content:space-between;align-items:center}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:7px 0}.slots.ally{grid-template-columns:repeat(4,minmax(0,1fr))}.slot{border:1px dashed #48627b;min-height:64px;border-radius:9px;background:#0c1a29;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:2px;min-width:0;color:var(--txt);padding:3px;position:relative}.slot.set{border-style:solid;border-color:#76b6b5;background:#1b3546}.slot .avatar{width:33px;height:33px}.slot small{font-size:9px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.remove{position:absolute;right:3px;top:0;color:#ffb9c4}.search{background:#0a1725;color:var(--txt);border:1px solid #45647a;border-radius:8px;width:100%;padding:11px;margin:3px 0 5px;font-size:16px}.search:focus{outline:2px solid var(--teal)}.matches{max-height:145px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.match{border:1px solid #304e62;background:#122535;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--txt);text-align:left;min-width:0;padding:6px}.match .avatar{width:27px;height:27px}.match span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.quick{display:flex;gap:8px;margin:10px 0}.action{background:linear-gradient(110deg,#76e8c9,#a3c4ff);border:0;color:#06222a;padding:11px;border-radius:9px;font-weight:900;flex:1}.ghost{border:1px solid #436077;background:#1a2d3d;color:#e6f4ff;border-radius:9px;padding:10px 14px;font-weight:750}.itemgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.item{border:1px solid #38556b;background:#0d1b2a;border-radius:10px;min-height:133px;text-align:center;padding:9px 5px;position:relative}.item.core{border-color:#c7ad70}.item .avatar{width:50px;height:50px;margin:2px auto 5px}.item b{font-size:10px;line-height:1.25;display:block}.item small{font-size:9px;color:var(--muted);display:block;margin-top:4px}.n{position:absolute;left:7px;top:5px;color:var(--muted);font-size:10px}.line{margin:8px 0;padding:8px;background:#0c1b29;border-radius:8px;color:#d8ebf5;font-size:11px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}.chip{background:#20433d;border:1px solid #407166;padding:3px 7px;border-radius:6px;color:#c3f9e3;font-size:10px}.muted{color:var(--muted)}.why{padding:7px 0;border-bottom:1px solid #2b4052;font-size:11px}.why strong{color:#f7dfaa}details{border-top:1px solid #304a5c;margin-top:10px;padding-top:9px}summary{cursor:pointer;font-weight:800;color:#a5e8da}.foot{margin-top:15px;color:var(--muted);font-size:10px}.warn{color:#eecb8f}.score{float:right;font-size:10px;color:var(--muted)}@media(max-width:360px){.heroPick{gap:5px}.heroPick .avatar{height:35px;width:35px}.heroPick b{font-size:12px}.itemgrid{gap:4px}.item{min-height:125px}}

/* V1 Compact UI: layout only; no changes to draft or build logic */
main{max-width:460px;padding:10px 11px 28px}.brand{gap:8px;margin:2px 0 9px}.brand img{width:36px;height:36px;border-radius:9px}.brand strong{font-size:17px}.brand .sub{font-size:9px}.patch{padding:4px 6px;font-size:9px}.panel{padding:9px;margin-bottom:8px;border-radius:12px;box-shadow:none}.panel h2{font-size:12px;margin:0 0 6px}.slots{gap:5px;margin:5px 0}.slot{min-height:60px}.search{padding:8px;margin:4px 0;font-size:16px}.matches{max-height:138px}.match{padding:4px}.quick{margin:5px 0 8px}.quick .action{display:none}.quick .ghost{width:100%;padding:7px}.itemgrid{gap:5px;margin:8px 0}.item{min-height:112px;padding:6px 4px}.item .avatar{width:44px;height:44px}.line{padding:7px;margin:6px 0}.chips{gap:4px;margin:6px 0}.chip{padding:3px 6px}.foot{font-size:9px;margin-top:9px}
#heroPanel{padding:7px 9px}#heroPanel .hero-expanded{display:none}#heroPanel.open .hero-expanded{display:block}#heroPanel.open #compactHero{display:none}
#compactHero{display:flex;align-items:center;gap:8px;width:100%;padding:3px 2px;background:transparent;color:var(--txt);border:0;text-align:left}#compactHero .avatar{width:34px;height:34px}#compactHero .who{flex:1;min-width:0}#compactHero b{font-size:12px;display:block}#compactHero small{font-size:10px;color:var(--muted);display:block}#compactHero .change{color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}
#heroPanel.open .heroPick{padding:6px 5px;gap:6px}#heroPanel.open .heroPick.active{padding:5px 4px}#heroPanel.open .heroPick .avatar{height:36px;width:36px}#heroPanel.open .heroPick b{font-size:12px}#heroPanel.open .heroPick small{font-size:9px}#heroPanel.open #heroInfo{font-size:10px;margin-top:6px!important}
#result .itemgrid + .chips{margin-top:5px}#result h2{margin:5px 0 7px}#result .why{padding:6px 0}#result details{margin-top:7px;padding-top:7px}
</style></head><body><main><header class="brand"><img src="./icon-192.png" alt="Roam Tank Lab"><div><strong>Roam Tank Lab <span style="color:var(--teal)">V1</span></strong><div class="sub">Belerick / Tigreal · Roam build</div></div><span class="patch">2.2.23</span></header>
<section class="panel" id="heroPanel"><button type="button" id="compactHero" aria-expanded="false" aria-controls="heroChooser"><span class="avatar" id="compactHeroFace">BE</span><span class="who"><b id="compactHeroName">Belerick</b><small id="compactHeroRole">Tank · Reflect & Taunt</small></span><span class="change">Ganti hero ▾</span></button><div class="hero-expanded" id="heroChooser"><h2>🛡️ Pilih hero</h2><div class="heroes"><button id="pickBelerick" class="heroPick active" aria-pressed="true"><span class="avatar" id="faceBelerick">BE</span><span><b>Belerick</b><small>Reflect • HP • Taunt</small></span></button><button id="pickTigreal" class="heroPick" aria-pressed="false"><span class="avatar" id="faceTigreal">TI</span><span><b>Tigreal</b><small>Engage • Setup • CC</small></span></button></div><div class="fine" id="heroInfo" style="margin-top:9px"></div></div></section>
<section class="panel"><div class="boxhead"><h2>⚔️ Musuh</h2><span id="enemyCount" class="fine">0/5</span></div><div id="enemySlots" class="slots"></div><input id="enemySearch" class="search" placeholder="Cari hero musuh…" autocomplete="off"><div id="enemyMatches" class="matches"></div></section>
<section class="panel"><div class="boxhead"><h2>🤝 Teman</h2><span id="allyCount" class="fine">0/4</span></div><div id="allySlots" class="slots ally"></div><input id="allySearch" class="search" placeholder="Cari hero teman…" autocomplete="off"><div id="allyMatches" class="matches"></div></section>
<div class="quick"><button id="buildBtn" class="action">⚡ Buat Build Roam</button><button id="resetBtn" class="ghost">Reset draft</button></div><section class="panel" id="result"><div class="fine">Pilih hero lalu isi draft musuh dan teman. Build akan menyesuaikan ancaman lawan.</div></section><p class="foot">Patch 2.2.23 · Analisis berdasarkan draft, bukan item musuh secara real-time.</p></main><script src="./data.js"></script><script src="./app.js"></script><script>
/* Compact hero chooser: UI only. Hero selection and the engine stay in app.js. */
(()=>{
 const panel=document.getElementById('heroPanel');
 const toggle=document.getElementById('compactHero');
 const face=document.getElementById('compactHeroFace');
 const name=document.getElementById('compactHeroName');
 const role=document.getElementById('compactHeroRole');
 const sync=()=>{
   const chosen=document.getElementById('pickTigreal').getAttribute('aria-pressed')==='true'?'Tigreal':'Belerick';
   name.textContent=chosen;
   role.textContent=chosen==='Belerick'?'Tank · Reflect & Taunt':'Tank · Engage & CC';
   const source=document.querySelector('#face'+chosen+' img');
   face.textContent=chosen.slice(0,2).toUpperCase();
   if(source){const copy=source.cloneNode(true);face.appendChild(copy);}
 };
 const setOpen=open=>{panel.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));};
 toggle.addEventListener('click',()=>setOpen(true));
 ['Belerick','Tigreal'].forEach(n=>document.getElementById('pick'+n).addEventListener('click',()=>{sync();setOpen(false);}));
 sync();setOpen(false);
})();
</script></body></html>
